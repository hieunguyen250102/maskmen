# Render Blueprint: https://render.com/docs/blueprint-spec
#
# maskmen needs one long-running Node process -- Next and Socket.IO share it, and
# rooms live in its memory. That is why it cannot run on Vercel's serverless
# functions, and why this service must never scale past a single instance.
services:
  - type: web
    name: maskmen
    runtime: node
    plan: free
    # Dev dependencies (TypeScript, type packages) are needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Other origins whose pages connect to this Socket.IO server (comma-separated).
      - key: CORS_ORIGINS
        value: https://maskmen.vercel.app
      # Signs login tokens; keep it stable or everyone is logged out.
      - key: SESSION_SECRET
        generateValue: true
      # Shared mail relay (oink-kit's oink-mail on Vercel), e.g. https://oink-mail.vercel.app/api/send-code
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      # Emails allowed to create rooms, comma-separated. Empty = anyone who logs in.
      - key: HOST_EMAILS
        sync: false
